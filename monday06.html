<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      .content {
        display: none;
      }
      .content.active {
        display: block;
      }
    </style>
    <title>자바스크립트 탭 메뉴 연습</title>
  </head>
  <body>
    <h2>제품 상세 보기</h2>

    <div class="tabs">
      <button type="tab">상품 정보</button>
      <button type="tab">배송 안내</button>
      <button type="tab">상품 후기</button>
    </div>

    <div id="info" class="content active">고품질 무선 키보드 입니다</div>

    <div id="delivery" class="content">배송은 결제 후 2~3일 소요 됩니다</div>

    <div id="review" class="content">상품 후기를 확인할 수 있습니다</div>

    <script>
      const tabs = document.querySelectorAll(".tab"); // 클래스가 tab인 모든 커튼을 찾아서 tabs에 저장하라
      const contents = document.querySelectorAll(".content"); // content인 텍스트들을 찾아와서 contents에 저장

      tabs.forEach(function (tab) {
        tab.addEventListener("click", function () {
          tabs.forEach(function (item) {
            item.classList.remove("active");
          });
          contents.forEach(function (content) {
            content.classList.remove("active");
          });

          tab.classList.add("active");

          const targetId = tab.dataset.target;
          document.getElementById(targetId).classList.add("active");
        });
      });
    </script>
  </body>
</html>
