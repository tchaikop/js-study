<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- <script src="monday01.js"></script> -->
    <title>회원 로그인</title>
  </head>
  <body>
    <h2>로그인</h2>

    <form>
      아이디:<input type="text" id="userId" /><br /><br />
      비밀번호: <input type="password " id="password" />
      <button type="submit" onclick="checklogin()">로그인</button>
      <button type="reset">취소</button>
    </form>

    <script>
      function checklogin() {
        const userId = document.getElementById("userId").value.trim(); //유저가 입력한 아이디값, 괄호 같은 것을 빼고
        const pw = document.getElementById("password").value.trim(); // trim 은 문자열 양쪽의공백을 없애기

        if (userId === "") {
          // 참이라면 user가 공백을 입력했다는 뜻이야, 이 경우 경고창
          alert("아이디를 입력하세요");
          return false; // return 문이 샐행되면 함수가 종료된다
        }
        if (pw === "") {
          alert("비밀번호를 입력하세요");
          return false;
        }

        return true;
      }
    </script>
  </body>
</html>
