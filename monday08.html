<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>10% 상품 할인 계산</h1>
    <hr />
    상품 가격:
    <input
      type="number"
      id="price"
      min="0"
      placeholder="가격 입력"
    />원<br /><br />
    <button onclick="discount()">10% 할인 가격</button>
    <hr />

    <p id="result"></p>

    <script>
      function discount() {
        const price = document.getElementById("price").value; // value를 안쓰면 태그 까지 와버린다
        const result = price * 0.9;
        document.getElementById("result").textContent = result;
      }
    </script>
  </body>
</html>
