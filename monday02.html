<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원 가입</title>
  </head>
  <body>
    <h2>회원 가입</h2>
    <form>
      아이디: <input type="text" id="userId" /><br />
      비밀번호: <input type="password" id="password" /><br />
      비밀번호 확인:<input type="password" id="passwordCheck" /><br />
      이름:<input type="text" id="userName" /><br />
      이메일: <input type="email" id="userEmail" /><br />
      <button type="submit" onclick="checkSignup()">회원가입</button>
      <button type="reset">취소</button>
    </form>
    <script>
      function checkSignup() {
        let userId = document.getElementById("userId").value.trim();
        let userpw = document.getElementById("password").value.trim();
        let passwordCheck = document
          .getElementById("passwordCheck")
          .value.trim();
        let userName = document.getElementById("userName").value.trim();
        let userEmail = document.getElementById("userEmail").value.trim();

        if (userpw.length < 5) {
          alert("비밃ㄴ호가 5자 이상이어야 합니다");
          return false;
        }

        if (userpw !== passwordCheck) {
          alert("비밀번호가 틀리다");
          return false;
        }
        if (userName === "") {
          alert("입력하세요, 공란입니다");
          return false;
        }

        if (userId === "") {
          alert("입력하세요, 공란입니다");
          return false;
        }
        if (userEmail === "") {
          alert("입력하세요, 공란입니다");
          return false;
        }

        if (!userEmail.includes("@") || !userEmail.includes(".")) {
          alert("올바른 이멜 형식이아니다");
          return false;
        }

        alert("회원가입이 완료 되었습니다"); // 최종 유효성 체크를 통과한 경우

        return true; // submit
      }
    </script>
  </body>
</html>
