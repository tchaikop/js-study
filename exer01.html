<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>나이 확인</title>
  </head>
  <body>
    <h1 id="result">나이 확인 프로그램</h1>
    <button onclick="checkage()">나이 확인</button>

    <script>
      function checkage() {
        let age = prompt("나이를 입력하세요");

        if (age >= 19) {
          document.getElementById("result").textContent = "성년";
        } else {
          document.getElementById("result").textContent = "미성년";
        }
      }
    </script>
  </body>
</html>
