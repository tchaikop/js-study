<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>접속하신 분의 이름</h1>
    <h2 id="result">이름이 찍히는 곳</h2>

    <button onclick="chagename()">이름을 입력</button>

    <script>
      function chagename() {
        let name = prompt("이름을 입력하세요");
        document.getElementById("result").textContent = name;
      }
    </script>
  </body>
</html>
