<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>연습문제 1</title>
  </head>
  <body>
    <h1>회원 로그인</h1>

    <form>
      아이디: <input type="text" id="text" /><br /><br />
      비밀번호: <input type="password" id="password" /><br /><br />

      <button onclick="logincheck()">로그인</button>
    </form>

    <script>
      function logincheck() {
        const id = document.getElementById("text").value.trim();
        const pw = document.getElementById("password").value.trim();

        if (id == "" || pw == "") {
          alert("  공란이 존재 합니다");
        }
      }
    </script>
  </body>
</html>
