<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입</title>
    <link rel="stylesheet" href="exer02.css" />
    <!-- <script src="exer02.css"></script> -->
  </head>
  <body>
    <div class="container">
      <h1>회원 가입</h1>

      <form id="signupform">
        <div class="form-group">
          <label>아이디</label>
          <input
            type="text"
            id="userId"
            placeholder="영문 소무자와 숫자 4~20"
          />
          <div class="error" id="userIderror"></div>
        </div>

        <div class="form-group">
          <label>비밀번호</label>
          <input type="password" id="password" placeholder="8 자 이상" />
          <div class="error" id="passworderror"></div>
        </div>

        <div class="form-group">
          <label>비밀번호확인</label>
          <input
            type="password"
            id="passwordCheck"
            placeholder="비밀번호를 다시 입력하세요"
          />
          <div class="error" id="passwordCheckError"></div>
        </div>

        <div class="form-group">
          <label>이름</label>
          <input type="password" id="name" placeholder="한글이름 입력" />
          <div class="error" id="nameError"></div>
        </div>

        <div class="form-group">
          <label>이메일</label>
          <input type="password" id="email" placeholder="example@email.com" />
          <div class="error" id="emailError"></div>
        </div>

        <button type="submit">가입하기</button>
      </form>
    </div>

    <script src="exer02.css"></script>
  </body>
</html>
