<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- -->
    <h1 id="title">안녕하세요</h1>

    <button onclick="changeText1()">글자변경</button>
    <button onclick="changeText2()">글자변경</button>
    <hr />
    <button onclick="callname()">이름을 입력하세요</button>

    <p id="name"></p>

    <script>
      // 자바스크립트 메서드 (함수)
      function changeText1() {
        document.getElementById("title").textContent = "반갑습니다";
      }
      function changeText2() {
        document.getElementById("title").textContent = "집에간다";
      }

      function callname() {
        let name = prompt("이름을 입력하세요");
        document.getElementById("name").textContent = name;
      }

  </body>
</html>
